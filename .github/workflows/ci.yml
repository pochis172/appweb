name: validacion pagina

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

jobs:
  validacion:
    runs-on: ubuntu-latest
    steps:
      - name: clonar repositorio
        uses: actions/checkout@v3
      - name: instalar node
        uses: actions/setup-node@v3
        with:
          node-version: "25"
      - name: validar codigo HTML
        run: |
          echo "inicio"
          npx html-validate "**/*.html"
          echo "fin"